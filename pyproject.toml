[project]
name = "copiloto"
version = "0.1.0"
description = "A LangGraph copilot that estimates monotributo category and exclusion risk from synthetic invoices."
readme = "README.md"
# Pinned below 3.13: langchain-core warns that Pydantic V1 internals are not
# compatible with Python 3.14 or greater.
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
