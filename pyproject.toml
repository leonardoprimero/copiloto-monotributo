[project]
name = "copiloto"
version = "0.2.0"
description = "A LangGraph copilot that estimates monotributo category and exclusion risk from synthetic invoices."
readme = "README.md"
# Pinned below 3.13: langchain-core warns that Pydantic V1 internals are not
# compatible with Python 3.14 or greater.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
copiloto = "copiloto.cli:main"

# Optional: only needed for COPILOTO_EXTRACTOR=api. The default (fake) and the
# cli mode work with nothing installed beyond the base dependencies.
[project.optional-dependencies]
api = [
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1,<2",
]
ocr = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
